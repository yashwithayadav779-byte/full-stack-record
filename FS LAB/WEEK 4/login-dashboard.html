    <body>

            <input type="password" id="password" placeholder="Enter your Password">
              <p id="error"></p>
            <button onclick="loginValidity()" id="btn">Login</button>
          
        </div>
        <script>
           function loginValidity(){
           let uname=document.getElementById("name1").value.trim();
            let password=document.getElementById("password").value.trim();
            let defaultUname="Shanmukh";
            let defaultPassword="ShannuHas2024";
            let error=document.getElementById("error");
            error.innerHTML="";
            if(uname==""){
                error.innerHTML="*UserName is required";
                return;
            }
            if(password==""){
                error.innerHTML="*Password is required";
                return;
            }
            if(uname==defaultUname && password==defaultPassword){
                window.location.href="success.html";
            }
            else{
                error.innerHTML="<b>Invalid UserName or Password.</b>";
            }
        }
        </script>
